<!DOCTYPE html>
<html>
<head>
    <title>Kaçan Kedi</title>
    <!-- İnternetten robotik fontu (Orbitron) çekiyoruz -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(to bottom, black, blue);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        /* Eklediğin yazının stili, rengi ve parlama efekti */
        #baslik {
            font-family: 'Orbitron', sans-serif;
            color: #00ffcc; /* Neon yeşilimsi mavi */
            text-align: center;
            margin-top: 30px;
            text-shadow: 0 0 15px #00ffcc; /* Parlama efekti */
            position: relative; 
            z-index: 10; /* Yazının kedinin arkasında kalmasını engeller */
        }

        #kedi {
            position: absolute;
            top: 50%;
            left: 50%;
            transition: top 0.2s, left 0.2s;
        }
    </style>
</head>
<body>
    <!-- En üste eklediğimiz yazı -->
    <h1 id="baslik">The Serra Docker dd d- denemesi 
        SELAM CNM</h1>

    <!-- Kedi GIF'i -->
    <div id="kedi"><img src="kedi.gif" width="200"></div>

    <script>
        const kedi = document.getElementById('kedi');
        
        kedi.addEventListener('mouseover', function() {
            // Kedi artık ekranın çok kenarlarına gidip kaybolmasın diye -150 piksel pay bıraktık
            const yeniX = Math.random() * (window.innerWidth - 150);
            const yeniY = Math.random() * (window.innerHeight - 150);
            
            kedi.style.left = yeniX + 'px';
            kedi.style.top = yeniY + 'px';
        });
    </script>
</body>
</html>
